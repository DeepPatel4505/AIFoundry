<div class="toast-container">
  <div *ngFor="let toast of toasts()" 
       class="toast-item" 
       [class]="toast.type">
    <span class="toast-message">{{ toast.message }}</span>
    <button class="toast-close-btn" (click)="remove(toast.id)" aria-label="Close message">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="toast-close-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
