<div class="prompt-card" [routerLink]="['/prompts', prompt.id]" style="cursor: pointer;">
  <!-- Top Header Row -->
  <div class="card-header">
    <div class="identity-group">
      <!-- Icon Wrapper -->
      <div class="node-icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 0 1-2.25 2.25M16.5 7.5V18a2.25 2.25 0 0 0 2.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 0 0 2.25 2.25h13.5M6 7.5h3v3H6v-3Z" />
        </svg>
      </div>

      <div class="title-badges">
        <h3 class="prompt-title">{{ prompt.name }}</h3>
      </div>
    </div>
  </div>

  <!-- Description Body -->
  <div class="card-body">
    <p class="prompt-description">{{ prompt.description }}</p>

    <!-- Tags Row below Description -->
    <div class="badges-row">
      <span class="tag-badge" *ngFor="let t of prompt.tags">
        {{ t }}
      </span>
    </div>
  </div>

  <!-- Footer Row -->
  <div class="card-footer">
    <!-- Public / Private visibility marker -->
    <div class="visibility-status">
      <span class="vis-dot" [class.public]="prompt.isPublic"></span>
      <span class="vis-label">{{ prompt.isPublic ? 'Public' : 'Private' }}</span>
    </div>

    <!-- Right Side Actions & Badges -->
    <div class="footer-right">
      <!-- Recommended Model -->
      <span class="category-pill" *ngIf="prompt.model">{{ prompt.model }}</span>
    </div>
  </div>
</div>
