<div class="filter-panel">
  <!-- Search Input -->
  <div class="search-container">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="search-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
    </svg>
    <input type="text" 
           [(ngModel)]="searchQuery" 
           (ngModelChange)="onSearchChange()" 
           placeholder="Search prompts by name, description, tags, keywords..." 
           class="search-input" />
  </div>

  <!-- Filters Lists -->
  <div class="filters-container">
    <!-- Visibility Group -->
    <div class="filter-row">
      <span class="filter-header-label">VISIBILITY:</span>
      <div class="filter-options">
        <button class="filter-pill" 
                *ngFor="let opt of visibilityOptions" 
                [class.active]="activeVisibility === opt" 
                (click)="selectVisibility(opt)" 
                type="button">
          {{ opt === 'All' ? 'All Prompts' : opt }}
        </button>
      </div>
    </div>
  </div>
</div>
