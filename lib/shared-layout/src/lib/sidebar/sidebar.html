<aside class="sidebar" [class.collapsed]="isCollapsed" aria-label="Sidebar Navigation">
  <div class="sidebar-content">
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <!-- Home Link -->
        <li class="nav-item">
          <a class="nav-link" 
             routerLink="/home" 
             routerLinkActive="active"
             (click)="onItemClick('home')"
             [attr.aria-current]="activePath === 'home' ? 'page' : null">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
            </svg>
            <span class="nav-label">Home</span>
          </a>
        </li>

        <!-- Catalogues Accordion Group -->
        <li class="nav-item group-item">
          <button class="nav-link accordion-trigger" 
                  [class.group-active]="isGroupActive()"
                  (click)="toggleCatalogues()"
                  type="button"
                  [attr.aria-expanded]="cataloguesExpanded && !isCollapsed">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-icon" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.008 1.24l.885 1.77a2.25 2.25 0 0 0 2.007 1.24h1.98a2.25 2.25 0 0 0 2.007-1.24l.885-1.77a2.25 2.25 0 0 1 2.007-1.24h3.86m-18 0h18a2.25 2.25 0 0 1 2.25 2.25v4.5A2.25 2.25 0 0 1 18 21H6a2.25 2.25 0 0 1-2.25-2.25v-4.5a2.25 2.25 0 0 1 2.25-2.25ZM6.75 6.75h.75m-.75 3h.75m3-3h.75m-.75 3h.75m3-3h.75m-.75 3h.75M4.5 3h15A2.25 2.25 0 0 1 21.75 5.25v2.625a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V5.25A2.25 2.25 0 0 1 4.5 3Z" />
            </svg>
            <span class="nav-label">Catalogues</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="submenu-chevron" [class.rotated]="cataloguesExpanded && !isCollapsed" aria-hidden="true">
              <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
            </svg>
          </button>

          <!-- Submenu List (Accordion Style) -->
          <div class="submenu-wrapper" [class.expanded]="cataloguesExpanded && !isCollapsed">
            <ul class="submenu-list">
              <!-- Agents -->
              <li class="submenu-item">
                <a class="submenu-link" 
                   routerLink="/agents" 
                   routerLinkActive="active"
                   (click)="onItemClick('agents')">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="submenu-icon" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25" />
                  </svg>
                  <span class="submenu-label">Agents</span>
                </a>
              </li>

              <!-- MCP -->
              <li class="submenu-item">
                <a class="submenu-link" 
                   routerLink="/mcp" 
                   routerLinkActive="active"
                   (click)="onItemClick('mcp')">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="submenu-icon" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0 0 20.25 18V6A2.25 2.25 0 0 0 18 3.75H6A2.25 2.25 0 0 0 3.75 6v12A2.25 2.25 0 0 0 6 20.25Z" />
                  </svg>
                  <span class="submenu-label">MCP</span>
                </a>
              </li>

              <!-- Skills -->
              <li class="submenu-item">
                <a class="submenu-link" 
                   routerLink="/skills" 
                   routerLinkActive="active"
                   (click)="onItemClick('skills')">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="submenu-icon" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
                  </svg>
                  <span class="submenu-label">Skills</span>
                </a>
              </li>

              <!-- Prompts -->
              <li class="submenu-item">
                <a class="submenu-link" 
                   routerLink="/prompts" 
                   routerLinkActive="active"
                   (click)="onItemClick('prompts')">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="submenu-icon" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l3.055-3.61c.196-.29.516-.475.866-.5.115-.009.23-.02.346-.031 1.584-.14 2.707-1.533 2.707-3.132V6.75a2.25 2.25 0 0 0-2.25-2.25h-10.5A2.25 2.25 0 0 0 1.5 6.75v5.01Z" />
                  </svg>
                  <span class="submenu-label">Prompts</span>
                </a>
              </li>
            </ul>
          </div>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Collapse Action Button -->
  <div class="sidebar-footer">
    <button class="collapse-toggle" 
            (click)="toggleCollapse()" 
            type="button" 
            [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="collapse-icon" [class.rotated]="isCollapsed" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5" />
      </svg>
      <span class="collapse-label">Collapse Menu</span>
    </button>
  </div>
</aside>
