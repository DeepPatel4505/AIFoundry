<header class="header">
  <div class="header-container">
    <!-- Brand / Logo Section -->
    <div class="brand-section">
      <div class="logo-container">
        <!-- Premium SVG Logo symbolizing gateways/transitions (Janus) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" class="brand-logo" aria-hidden="true">
          <defs>
            <linearGradient id="logo-gradient-left" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#818cf8" />
              <stop offset="100%" stop-color="#4f46e5" />
            </linearGradient>
            <linearGradient id="logo-gradient-right" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c084fc" />
              <stop offset="100%" stop-color="#9333ea" />
            </linearGradient>
          </defs>
          <!-- Left crescent/gate -->
          <path d="M16,6 C10.48,6 6,12.27 6,20 C6,27.73 10.48,34 16,34 C12.69,34 10,27.73 10,20 C10,12.27 12.69,6 16,6 Z" fill="url(#logo-gradient-left)" />
          <!-- Right crescent/gate -->
          <path d="M24,6 C27.31,6 30,12.27 30,20 C30,27.73 27.31,34 24,34 C29.52,34 34,27.73 34,20 C34,12.27 29.52,6 24,6 Z" fill="url(#logo-gradient-right)" />
          <!-- Center connector/nexus -->
          <circle cx="20" cy="20" r="3.5" fill="#f8fafc" class="logo-core" />
        </svg>
      </div>
      <span class="brand-name">{{ companyName }}</span>
    </div>

    <!-- User & Dropdown Section -->
    <div class="user-section">
      <button class="profile-trigger" (click)="toggleMenu($event)" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle profile menu" type="button">
        <div class="avatar-container">
          <ng-container *ngIf="userAvatarUrl; else initialsTpl">
            <img [src]="userAvatarUrl" [alt]="userName" class="avatar-image" />
          </ng-container>
          <ng-template #initialsTpl>
            <div class="avatar-initials">{{ getInitials() }}</div>
          </ng-template>
        </div>
        <span class="user-name">{{ userName }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="chevron-icon" [class.rotated]="isMenuOpen">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu" [class.open]="isMenuOpen" role="menu">
        <div class="dropdown-header">
          <div class="dropdown-header-info">
            <div class="user-fullname">{{ userName }}</div>
            <div class="user-role">{{ userRole }}</div>
          </div>
        </div>
        
        <div class="dropdown-divider"></div>

        <ul class="dropdown-list">
          <li role="none">
            <button class="dropdown-item" (click)="onProfileClick()" role="menuitem" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="item-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
              <div class="item-content">
                <span class="item-title">Profile</span>
                <span class="item-description">View settings and statistics</span>
              </div>
            </button>
          </li>
          
          <li role="none">
            <button class="dropdown-item" (click)="onSettingsClick()" role="menuitem" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="item-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.936 6.936 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <div class="item-content">
                <span class="item-title">Settings</span>
                <span class="item-description">Manage configurations</span>
              </div>
            </button>
          </li>
        </ul>

        <div class="dropdown-divider"></div>

        <ul class="dropdown-list">
          <li role="none">
            <button class="dropdown-item logout-item" (click)="onLogoutClick()" role="menuitem" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="item-icon logout-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
              </svg>
              <div class="item-content">
                <span class="item-title text-danger">Log Out</span>
                <span class="item-description text-danger-muted">Exit your session</span>
              </div>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
