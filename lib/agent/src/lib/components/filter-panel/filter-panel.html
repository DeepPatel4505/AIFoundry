<div class="filter-panel">
  <!-- Search Input -->
  <div class="search-container">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="search-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
    </svg>
    <input type="text" 
           [(ngModel)]="searchQuery" 
           (ngModelChange)="onSearchChange()" 
           placeholder="Search agents by name, description, tags, team..." 
           class="search-input" />
  </div>

  <!-- Filters Lists -->
  <div class="filters-container">
    <!-- Status Group -->
    <div class="filter-row">
      <span class="filter-header-label">STATUS:</span>
      <div class="filter-options">
        <button class="filter-pill" 
                [class.active]="activeStatus === 'All'" 
                (click)="selectStatus('All')" 
                type="button">
          All Agents
        </button>
        <button class="filter-pill" 
                [class.active]="activeStatus === 'Drafts'" 
                (click)="selectStatus('Drafts')" 
                type="button">
          Drafts
        </button>
        <button class="filter-pill" 
                [class.active]="activeStatus === 'Needs Attention'" 
                (click)="selectStatus('Needs Attention')" 
                type="button">
          Needs Attention
          <span class="attention-badge" *ngIf="(needsAttentionCount$ | async) as count">{{ count }}</span>
        </button>
      </div>
    </div>

    <!-- Visibility Group -->
    <div class="filter-row">
      <span class="filter-header-label">VISIBILITY:</span>
      <div class="filter-options">
        <button class="filter-pill" 
                *ngFor="let opt of visibilityOptions" 
                [class.active]="activeVisibility === opt" 
                (click)="selectVisibility(opt)" 
                type="button">
          {{ opt === 'All' ? 'All Visibilities' : opt }}
        </button>
      </div>
    </div>

    <!-- Sort By Group -->
    <div class="filter-row">
      <span class="filter-header-label">SORT BY:</span>
      <div class="filter-options">
        <button class="filter-pill" 
                *ngFor="let opt of sortOptions" 
                [class.active]="activeSort === opt" 
                (click)="selectSort(opt)" 
                type="button">
          {{ opt }}
        </button>
      </div>
    </div>

    <!-- Add filter button -->
    <div class="add-filter-row">
      <button class="add-filter-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="add-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add filter
      </button>
    </div>
  </div>
</div>
