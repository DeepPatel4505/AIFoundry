<div class="skill-card" [class.tool-card]="skill.category === 'tool'" (click)="openDetail()">
  <!-- Top Header Row -->
  <div class="card-header">
    <div class="identity-group">
      <!-- Category Icon Wrapper -->
      <div class="node-icon-wrapper" [ngClass]="skill.category">
        <!-- SVG Tool icon -->
        <svg *ngIf="skill.category === 'tool'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
        </svg>
        <!-- SVG Logic icon -->
        <svg *ngIf="skill.category === 'logic'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <!-- SVG API icon -->
        <svg *ngIf="skill.category === 'api'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582" />
        </svg>
      </div>

      <div class="title-badges">
        <h3 class="skill-title" [title]="skill.name">{{ skill.name }}</h3>
        <!-- Badges Row with clean margin below title -->
        <div class="badges-row">
          <span class="category-badge" [ngClass]="skill.category">
            {{ skill.category | uppercase }}
          </span>
          <span class="version-badge">v{{ skill.version }}</span>
          <span class="source-badge" [ngClass]="skill.sourceType.toLowerCase()">
            {{ skill.sourceType }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Description Body (Exact appearance as prompt card) -->
  <div class="card-body">
    <p class="skill-description">{{ skill.description || 'No description provided.' }}</p>

    <!-- Tags Row below Description -->
    <div class="badges-row tags-row" *ngIf="skill.tags && skill.tags.length > 0">
      <span class="tag-badge" *ngFor="let t of skill.tags">
        #{{ t }}
      </span>
    </div>
  </div>

  <!-- Footer Row (Same layout as prompt card) -->
  <div class="card-footer">
    <!-- Verification Status Marker on Left -->
    <div class="visibility-status">
      <span class="vis-dot" [class.verified]="skill.verificationStatus === 'VERIFIED'"></span>
      <span class="vis-label">{{ skill.verificationStatus === 'VERIFIED' ? 'Verified' : 'Active' }}</span>
    </div>

    <!-- Right Side Copy CLI Action -->
    <div class="footer-right">
      <button class="copy-cli-pill" (click)="copyInstallCommand($event)" title="Copy CLI install command" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="copy-svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
        <span>Copy CLI</span>
      </button>
    </div>
  </div>
</div>
