<div class="skill-card" [class.tool-card]="skill.category === 'tool'">
  <!-- Top Header Row -->
  <div class="card-header">
    <div class="identity-group">
      <!-- Category Icon Wrapper -->
      <div class="node-icon-wrapper" [ngClass]="skill.category">
        <!-- SVG Tool icon -->
        <svg *ngIf="skill.category === 'tool'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
        </svg>
        <!-- SVG Logic icon -->
        <svg *ngIf="skill.category === 'logic'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <!-- SVG API icon -->
        <svg *ngIf="skill.category === 'api'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="node-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582" />
        </svg>
      </div>

      <div class="title-badges">
        <h3 class="skill-title">{{ skill.name }}</h3>
        <div class="badges-row">
          <span class="category-badge" [ngClass]="skill.category">
            {{ skill.category | uppercase }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Description Body -->
  <div class="card-body">
    <p class="skill-description">{{ skill.description }}</p>

    <!-- Skill Definition snippet -->
    <div class="definition-block" *ngIf="skill.definition">
      <div class="definition-header">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="code-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
        </svg>
        <span>Definition</span>
      </div>
      <div class="definition-box">
        <code>{{ skill.definition }}</code>
      </div>
    </div>
  </div>

  <!-- Footer Row -->
  <div class="card-footer">
    <div class="usage-count">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="chart-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
      </svg>
      <span>Used {{ skill.usageCount }} times</span>
    </div>
  </div>
</div>
