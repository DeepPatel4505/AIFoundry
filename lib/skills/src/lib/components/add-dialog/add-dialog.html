<div class="modal-overlay" *ngIf="isOpen()" (click)="close()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Register Skill</h2>
      <button class="close-btn" (click)="close()" aria-label="Close dialog" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="close-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <form class="form-grid" #skillForm="ngForm" (ngSubmit)="register()">
        <!-- Name -->
        <div class="form-group full-width">
          <label class="form-label" for="skill-name">Name *</label>
          <input type="text" 
                 id="skill-name" 
                 name="name"
                 [(ngModel)]="name" 
                 placeholder="e.g. Customer Support" 
                 class="form-input" 
                 required 
                 #nameField="ngModel"
                 [class.invalid]="nameField.invalid && nameField.touched" />
          <span class="error-text" *ngIf="nameField.invalid && nameField.touched">Name is required.</span>
        </div>

        <!-- Description -->
        <div class="form-group full-width">
          <label class="form-label" for="skill-desc">Description</label>
          <textarea id="skill-desc" 
                    name="description"
                    [(ngModel)]="description" 
                    placeholder="e.g. Handles customer support conversations..." 
                    class="form-textarea" 
                    rows="2"></textarea>
        </div>

        <!-- Skill Category -->
        <div class="form-group full-width">
          <label class="form-label" for="skill-category">Category</label>
          <select id="skill-category" name="category" [(ngModel)]="category" class="form-input">
            <option value="tool">Tool</option>
            <option value="logic">Logic</option>
            <option value="api">API</option>
          </select>
        </div>

        <!-- Skill Definition -->
        <div class="form-group full-width">
          <div class="label-row">
            <label class="form-label" for="skill-def">Skill Definition (SKILL.md) *</label>
            <span class="label-hint" *ngIf="loadedFileName">Loaded from {{ loadedFileName }}</span>
          </div>
          <textarea id="skill-def" 
                    name="definition"
                    [(ngModel)]="definition" 
                    placeholder="# Skill Name&#10;&#10;Instructions for agent capabilities..." 
                    class="form-textarea code-style" 
                    rows="6"
                    required
                    #defField="ngModel"
                    [class.invalid]="defField.invalid && defField.touched"></textarea>
          <span class="error-text" *ngIf="defField.invalid && defField.touched">Skill Definition is required.</span>
        </div>

        <!-- Import / Upload direct triggers -->
        <div class="form-group full-width extra-actions">
          <!-- Hidden inputs for single file and folder upload -->
          <input type="file" #fileInput accept=".md,.zip" (change)="onFileSelected($event)" style="display: none;" />
          <input type="file" #folderInput webkitdirectory directory multiple (change)="onFolderSelected($event)" style="display: none;" />

          <!-- Upload SKILL.md -->
          <button type="button" class="action-trigger-btn" (click)="triggerFileUpload()" [disabled]="isSubmitting" title="Upload SKILL.md or package archive">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="btn-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            Upload SKILL.md
          </button>

          <!-- Upload Folder Directly -->
          <button type="button" class="action-trigger-btn" (click)="triggerFolderUpload()" [disabled]="isSubmitting" title="Upload an entire skill folder">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="btn-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
            </svg>
            Upload Skill Folder
          </button>

          <!-- Import from Git -->
          <!-- <button type="button" class="action-trigger-btn" (click)="importFromGit()" [disabled]="isSubmitting" title="Import from GitHub repo">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="btn-icon">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0 0 20.25 18V6A2.25 2.25 0 0 0 18 3.75H6A2.25 2.25 0 0 0 3.75 6v12A2.25 2.25 0 0 0 6 20.25Z" />
            </svg>
            Import Git
          </button> -->
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <div class="validation-status-msg" *ngIf="isValidated">
        <span class="status-indicator-dot"></span> Verified Valid
      </div>
      <div class="footer-actions">
        <button class="validate-btn" (click)="validate()" [disabled]="!name.trim() || !definition.trim()" type="button">Validate</button>
        <button class="register-btn" 
                (click)="register()" 
                [disabled]="skillForm.invalid || !name.trim() || !definition.trim() || isSubmitting" 
                type="button">
          {{ isSubmitting ? 'Registering...' : 'Register' }}
        </button>
      </div>
    </div>
  </div>
</div>
